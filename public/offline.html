<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071914" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Valtora is waiting for an internet connection."
    />
    <title>Offline · Valtora</title>
    <style>
      :root {
        --ink: #f4fbf7;
        --muted: #a7bbb1;
        --surface: rgba(18, 47, 38, 0.86);
        --surface-border: rgba(190, 247, 217, 0.15);
        --emerald: #65e39d;
        --emerald-bright: #a8f5c8;
        --deep-green: #071914;
        --focus: #d8ffe6;
      }

      * { box-sizing: border-box; }

      html { min-height: 100%; background: var(--deep-green); }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 13%, rgba(62, 173, 119, 0.24), transparent 31rem),
          radial-gradient(circle at 84% 82%, rgba(42, 124, 92, 0.20), transparent 27rem),
          linear-gradient(145deg, #0b211a 0%, #071914 53%, #061610 100%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .page {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        position: relative;
        isolation: isolate;
      }

      .page::before, .page::after {
        position: absolute;
        z-index: -1;
        width: 15rem;
        height: 15rem;
        border: 1px solid rgba(148, 239, 186, 0.08);
        border-radius: 50%;
        content: "";
      }
      .page::before { top: -7rem; right: -7rem; }
      .page::after { bottom: -9rem; left: -8rem; width: 20rem; height: 20rem; }

      .shell {
        width: min(100%, 30rem);
        padding: 15px;
        border: 1px solid rgba(192, 250, 219, 0.1);
        border-radius: 32px;
        background: rgba(120, 219, 161, 0.05);
        box-shadow: 0 28px 80px rgba(0, 8, 5, 0.36), inset 0 1px rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
      }

      .card {
        padding: clamp(28px, 7vw, 42px);
        border: 1px solid var(--surface-border);
        border-radius: 22px;
        background: linear-gradient(140deg, rgba(27, 61, 49, 0.96), var(--surface));
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.045), inset 0 -24px 40px rgba(0, 0, 0, 0.1);
      }

      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 760; font-size: 1.15rem; letter-spacing: -0.04em; }
      .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 10px; color: #062116; background: linear-gradient(145deg, var(--emerald-bright), #4bc888); box-shadow: 0 8px 18px rgba(70, 216, 139, 0.22); }
      .brand-mark svg { width: 20px; height: 20px; }

      .signal-wrap { display: grid; place-items: center; margin: clamp(35px, 8vw, 50px) 0 29px; }
      .signal { position: relative; display: grid; place-items: center; width: 128px; height: 128px; border: 1px solid rgba(143, 236, 179, 0.18); border-radius: 50%; background: radial-gradient(circle, rgba(109, 222, 152, 0.14), rgba(42, 114, 79, 0.05) 62%, transparent 63%); box-shadow: inset 0 0 32px rgba(108, 229, 156, 0.07), 0 18px 42px rgba(0, 0, 0, 0.2); }
      .signal::before, .signal::after { position: absolute; border: 1px solid rgba(143, 236, 179, 0.12); border-radius: inherit; content: ""; }
      .signal::before { inset: -11px; }
      .signal::after { inset: -23px; border-color: rgba(143, 236, 179, 0.07); }
      .signal svg { width: 61px; height: 61px; color: var(--emerald-bright); filter: drop-shadow(0 5px 14px rgba(101, 227, 157, 0.16)); }

      h1 { max-width: 18rem; margin: 0; font-size: clamp(1.72rem, 7vw, 2.3rem); line-height: 1.12; letter-spacing: -0.055em; }
      .message { margin: 15px 0 0; color: var(--muted); font-size: 0.98rem; line-height: 1.65; }

      .status { display: inline-flex; align-items: center; gap: 9px; margin: 25px 0 0; padding: 8px 11px; border: 1px solid rgba(228, 255, 238, 0.09); border-radius: 999px; color: #d4e8dc; background: rgba(0, 0, 0, 0.13); font-size: 0.78rem; font-weight: 650; }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #f2b76d; box-shadow: 0 0 0 4px rgba(242, 183, 109, 0.12); }

      .retry { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 52px; margin-top: 31px; padding: 12px 20px; border: 1px solid rgba(215, 255, 230, 0.3); border-radius: 15px; color: #062116; background: linear-gradient(145deg, #b4f6d1, #65dd9b); box-shadow: 0 10px 26px rgba(52, 198, 116, 0.19), inset 0 1px rgba(255, 255, 255, 0.56); font: inherit; font-weight: 760; cursor: pointer; transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease; }
      .retry:hover { filter: brightness(1.045); transform: translateY(-1px); box-shadow: 0 14px 28px rgba(52, 198, 116, 0.25), inset 0 1px rgba(255, 255, 255, 0.56); }
      .retry:active { transform: translateY(1px); }
      .retry:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
      .retry[disabled] { cursor: wait; filter: saturate(0.68); opacity: 0.78; transform: none; }
      .refresh-icon { width: 18px; height: 18px; }
      .retry[aria-busy="true"] .refresh-icon { animation: spin 0.85s linear infinite; }
      .hint { margin: 18px 0 0; color: #8da59a; font-size: 0.78rem; line-height: 1.5; text-align: center; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @media (min-width: 600px) { .shell { width: min(100%, 32rem); padding: 18px; } .card { border-radius: 25px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="shell" aria-labelledby="offline-title">
        <div class="card">
          <div class="brand" aria-label="Valtora">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5 12 20l8-14.5h-4.3L12 12 8.3 5.5H4Z" fill="currentColor" /></svg></span>
            <span>Valtora</span>
          </div>
          <div class="signal-wrap" aria-hidden="true">
            <div class="signal"><svg viewBox="0 0 64 64" fill="none"><path d="M14 28.5a25.6 25.6 0 0 1 36 0M21.5 36a15 15 0 0 1 21 0M29 43.5a4.25 4.25 0 0 1 6 0M12 13l40 40" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" /></svg></div>
          </div>
          <h1 id="offline-title">No Internet Connection</h1>
          <p class="message">Valtora needs an internet connection to securely load your account and keep your information up to date.</p>
          <p class="status" role="status"><span class="status-dot" aria-hidden="true"></span><span>You’re currently offline</span></p>
          <button class="retry" id="retry-button" type="button" aria-describedby="retry-hint">
            <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15-3M4 5v4h4M4 13a8.1 8.1 0 0 0 15 3M20 19v-4h-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span class="button-label">Try Again</span>
          </button>
          <p class="hint" id="retry-hint">Check your Wi-Fi or mobile data, then try again.</p>
        </div>
      </section>
    </main>
    <script>
      (function () {
        const retryButton = document.getElementById("retry-button");
        const buttonLabel = retryButton.querySelector(".button-label");
        let isRefreshing = false;

        retryButton.addEventListener("click", function () {
          if (isRefreshing) return;

          isRefreshing = true;
          retryButton.disabled = true;
          retryButton.setAttribute("aria-busy", "true");
          buttonLabel.textContent = "Refreshing…";

          window.setTimeout(function () {
            window.location.reload();
          }, 250);
        });
      })();
    </script>
  </body>
</html>
